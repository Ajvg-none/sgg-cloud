<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo rojo de marca con esquinas redondeadas -->
  <rect width="64" height="64" rx="14" fill="#DC2626"/>
  <!-- Lente izquierdo (la "O") -->
  <circle cx="21" cy="34" r="9.5" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <!-- Lente derecho (la "C", abierta a la derecha) -->
  <path d="M 51.3 40.1 A 9.5 9.5 0 1 1 51.3 27.9" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Puente -->
  <path d="M 28.5 29.5 Q 32 25.5 35.5 29.5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- Patillas (puntos laterales) -->
  <circle cx="7" cy="34" r="2.6" fill="#FFFFFF"/>
  <circle cx="57" cy="34" r="2.6" fill="#FFFFFF"/>
</svg>